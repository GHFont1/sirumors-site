name: Watchdog

# Checks the live site's own output, not the job status. If the data is stale it
# re-runs the update job, keeps one open incident issue, and closes it only
# after a fresh, verified recovery.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live freshness
        id: live
        run: |
          set +e
          body=$(curl -fsS -m 30 "https://sirumors.com/status.json?ts=$(date +%s)")
          home=$(curl -fsS -m 30 -o /dev/null -w "%{http_code}" https://sirumors.com/)
          age=$(node -e 'try{const m=JSON.parse(process.argv[1]);console.log(((Date.now()-Date.parse(m.lastUpdated))/3600000).toFixed(2))}catch{console.log(999)}' "$body")
          stories=$(node -e 'try{console.log(JSON.parse(process.argv[1]).counts.items)}catch{console.log(0)}' "$body")
          odds=$(node -e 'try{const m=JSON.parse(process.argv[1]);const a=[m.rankingsAt,m.marketsAt].map(x=>(Date.now()-Date.parse(x))/3600000);console.log(Math.max(...a).toFixed(2))}catch{console.log(999)}' "$body")
          echo "age=$age home=$home stories=$stories boards_age=$odds"
          ok=$(node -e "console.log(($age < 2 && '$home' === '200' && $stories >= 100 && $odds < 6) ? 'yes' : 'no')")
          echo "ok=$ok" >> $GITHUB_OUTPUT
          echo "detail=data age ${age}h, home HTTP ${home}, ${stories} stories, rankings/odds age ${odds}h" >> $GITHUB_OUTPUT

      - name: Recover and track incident
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          open=$(gh issue list -R "$REPO" --label incident --state open --json number --jq '.[0].number')
          if [ "${{ steps.live.outputs.ok }}" = "yes" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$REPO" --body "Recovered and verified live: ${{ steps.live.outputs.detail }}."
              gh issue close "$open" -R "$REPO"
            fi
            exit 0
          fi
          gh label create incident -R "$REPO" --color B60205 2>/dev/null || true
          if [ -z "$open" ]; then
            gh issue create -R "$REPO" --label incident --title "SI Rumors live site is stale or down" --body "Detected: ${{ steps.live.outputs.detail }}. The watchdog is re-running the update job every hour until a fresh live check passes."
          else
            gh issue comment "$open" -R "$REPO" --body "Still failing: ${{ steps.live.outputs.detail }}. Re-running update."
          fi
          gh workflow run update.yml -R "$REPO"
          exit 1
