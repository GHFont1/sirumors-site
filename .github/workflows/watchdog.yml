name: Watchdog

# Checks the live site's own output, not the job status. If the data is stale it
# re-runs the update job, keeps one open incident issue, and closes it only
# after a fresh, verified recovery.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live freshness
        id: live
        run: |
          set +e
          body=$(curl -fsS -m 30 "https://sirumors.com/status.json?ts=$(date +%s)")
          home=$(curl -fsS -m 30 -o /dev/null -w "%{http_code}" https://sirumors.com/)
          age=$(node -e 'try{const m=JSON.parse(process.argv[1]);console.log(((Date.now()-Date.parse(m.lastUpdated))/3600000).toFixed(2))}catch{console.log(999)}' "$body")
          stories=$(node -e 'try{console.log(JSON.parse(process.argv[1]).counts.items)}catch{console.log(0)}' "$body")
          odds=$(node -e 'try{const m=JSON.parse(process.argv[1]);const a=[m.rankingsAt,m.marketsAt,m.resetsAt,m.labxAt].map(x=>(Date.now()-Date.parse(x))/3600000);console.log(Math.max(...a).toFixed(2))}catch{console.log(999)}' "$body")
          echo "age=$age home=$home stories=$stories boards_age=$odds"
          ok=$(node -e "console.log(($age < 2 && '$home' === '200' && $stories >= 100 && $odds < 6) ? 'yes' : 'no')")
          echo "ok=$ok" >> $GITHUB_OUTPUT
          echo "detail=data age ${age}h, home HTTP ${home}, ${stories} stories, rankings/odds/resets/lab-posts age ${odds}h" >> $GITHUB_OUTPUT

      - name: Recover and track incident
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          open=$(gh issue list -R "$REPO" --label incident --state open --json number --jq '.[0].number')
          if [ "${{ steps.live.outputs.ok }}" = "yes" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$REPO" --body "Recovered and verified live: ${{ steps.live.outputs.detail }}."
              gh issue close "$open" -R "$REPO"
            fi
            exit 0
          fi
          gh label create incident -R "$REPO" --color B60205 2>/dev/null || true
          if [ -z "$open" ]; then
            gh issue create -R "$REPO" --label incident --title "SI Rumors live site is stale or down" --body "Detected: ${{ steps.live.outputs.detail }}. The watchdog is re-running the update job every hour until a fresh live check passes."
          else
            gh issue comment "$open" -R "$REPO" --body "Still failing: ${{ steps.live.outputs.detail }}. Re-running update."
          fi
          gh workflow run update.yml -R "$REPO"
          # Recovery is under way and tracked in the incident issue; the Mac fixer lane sirumors-update escalates.
          exit 0

  copy:
    # Our own story write-ups come from the copywriter lane on the Mac (com.sirumors.copywriter).
    # It retries every 20 minutes by itself; this keeps one open issue while it is behind.
    runs-on: ubuntu-latest
    steps:
      - name: Check our write-ups are keeping up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          body=$(curl -fsS -m 30 "https://sirumors.com/status.json?ts=$(date +%s)")
          read age backlog < <(node -e 'const m=JSON.parse(process.argv[1]);console.log(((Date.now()-Date.parse(m.copyAt||0))/3600000).toFixed(1), m.copyBacklog??0)' "$body")
          echo "copy age ${age}h, backlog ${backlog}"
          open=$(gh issue list -R "$REPO" --label copywriter --state open --json number --jq '.[0].number')
          if node -e "process.exit(($age < 6 || $backlog < 60) ? 0 : 1)"; then
            [ -n "$open" ] && gh issue comment "$open" -R "$REPO" --body "Recovered: write-ups ${age}h old, backlog ${backlog}." && gh issue close "$open" -R "$REPO"
            exit 0
          fi
          gh label create copywriter -R "$REPO" --color FBCA04 2>/dev/null || true
          msg="Our write-ups are ${age}h old with ${backlog} stories waiting. The copywriter lane runs on the Mac (com.sirumors.copywriter, log ~/Library/Logs/sirumors-copywriter.log); stories show the publisher's summary on our own pages until it catches up."
          if [ -z "$open" ]; then gh issue create -R "$REPO" --label copywriter --title "Copywriter lane is behind" --body "$msg"; else gh issue comment "$open" -R "$REPO" --body "$msg"; fi

  digest:
    # The morning digest goes out at 7 AM Eastern from the update workflow (scripts/notify.mjs).
    # By 10 AM it must have gone out; if not, rerun the update and keep one open issue.
    runs-on: ubuntu-latest
    steps:
      - name: Check today's digest went out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          hour=$(TZ=America/New_York date +%H); today=$(TZ=America/New_York date +%F)
          body=$(curl -fsS -m 30 "https://sirumors.com/status.json?ts=$(date +%s)")
          day=$(node -e 'console.log(JSON.parse(process.argv[1]).digestDay||"")' "$body")
          echo "hour $hour, digest day '$day', today $today"
          open=$(gh issue list -R "$REPO" --label digest --state open --json number --jq '.[0].number')
          if [ "$day" = "$today" ] || [ "$hour" -lt 10 ]; then
            [ -n "$open" ] && [ "$day" = "$today" ] && gh issue comment "$open" -R "$REPO" --body "Recovered: today's digest went out." && gh issue close "$open" -R "$REPO"
            exit 0
          fi
          gh label create digest -R "$REPO" --color 5B3DF5 2>/dev/null || true
          msg="The daily digest for $today has not gone out (last: '$day'). Rerunning the update workflow; see the 'Alerts, release threads and emails' step log."
          if [ -z "$open" ]; then gh issue create -R "$REPO" --label digest --title "Daily digest did not go out" --body "$msg"; else gh issue comment "$open" -R "$REPO" --body "$msg"; fi
          gh workflow run update.yml -R "$REPO"
          # Recovery is under way and tracked in the incident issue; the Mac fixer lane sirumors-update escalates.
          exit 0
