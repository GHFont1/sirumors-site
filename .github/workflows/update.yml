name: Update and deploy

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ingest sources
        id: ingest
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ingest.mjs --data data

      - name: Model rankings and prediction markets
        id: boards
        continue-on-error: true
        run: node scripts/boards.mjs --data data

      - name: Alerts, release threads and emails
        id: notify
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/notify.mjs --data data

      - name: Save data
        working-directory: data
        run: |
          rm -rf .git/worktrees || true
          git config user.name "sirumors-bot"
          git config user.email "sirumors-bot@users.noreply.github.com"
          # one rolling commit: history lives in history.json, not git
          git checkout --orphan snapshot
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git push -f origin snapshot:data && break; sleep 5; done

      - run: npm run build

      - name: Verify build
        run: node scripts/verify-build.mjs

      - name: Publish status file
        run: node -e 'const m=require("./data/meta.json");require("fs").writeFileSync("out/status.json",JSON.stringify({lastUpdated:m.lastUpdated,lastAttempt:m.lastAttempt,lastAttemptOk:m.lastAttemptOk,counts:m.counts,failing:m.failing,rankingsAt:(()=>{try{return require("./data/rankings.json").generatedAt}catch{return null}})(),marketsAt:(()=>{try{return require("./data/markets.json").generatedAt}catch{return null}})()}))'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail if alerts are broken
        if: steps.notify.outcome == 'failure'
        run: echo "notify.mjs failed; see its step log." && exit 1

      - name: Fail if ingest is broken
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "Ingest failed this run; the site was rebuilt from the last good data."
          node -e 'const m=require("./data/meta.json");const age=(Date.now()-Date.parse(m.lastUpdated))/3600000;console.log("data age hours",age.toFixed(1));process.exit(age>2?1:0)'

      - name: Fail if rankings or odds go stale
        run: |
          node -e '
          const f=(n,h)=>{try{const d=require("./data/"+n);const age=(Date.now()-Date.parse(d.generatedAt))/3600000;console.log(n,"age hours",age.toFixed(1));return age>h}catch(e){console.log(n,"missing");return true}};
          const bad=[f("rankings.json",6),f("markets.json",6)].some(Boolean);process.exit(bad?1:0)'
